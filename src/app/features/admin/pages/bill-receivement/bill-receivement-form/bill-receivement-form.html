<div class="min-h-screen transition-colors duration-300 bg-gray-50 dark:bg-slate-900">

  <div class="mx-autor">

    <div class="lg:grid lg:grid-cols-12 lg:gap-x-8">

      <aside class="py-6 px-2 lg:col-span-3 lg:px-0 lg:py-0 lg:border-r lg:border-gray-200 dark:lg:border-white/10 lg:pr-8">
        <nav class="space-y-1">
          <a (click)="setTab('dados')"
             class="group flex items-center rounded-md px-3 py-2 text-sm font-medium transition-colors cursor-pointer"
             [ngClass]="activeTab === 'dados' ? 'border-l-4 bg-white text-indigo-600 border-indigo-600 shadow-sm dark:bg-slate-800 dark:text-white dark:border-indigo-500' : 'text-slate-600 hover:bg-white hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white'">
            <svg class="mr-3 h-6 w-6 flex-shrink-0" [ngClass]="activeTab === 'dados' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
            </svg>
            <span class="truncate">Informações Gerais</span>
          </a>

          <a (click)="setTab('cliente')"
             class="group flex items-center rounded-md px-3 py-2 text-sm font-medium transition-colors cursor-pointer"
             [ngClass]="activeTab === 'cliente' ? 'border-l-4 bg-white text-indigo-600 border-indigo-600 shadow-sm dark:bg-slate-800 dark:text-white dark:border-indigo-500' : 'text-slate-600 hover:bg-white hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white'">
            <svg class="mr-3 h-6 w-6 flex-shrink-0" [ngClass]="activeTab === 'cliente' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
            </svg>
            <span class="truncate">Cliente e Observação</span>
          </a>

          <a (click)="setTab('pagamento')"
             class="group flex items-center rounded-md px-3 py-2 text-sm font-medium transition-colors cursor-pointer"
             [ngClass]="activeTab === 'pagamento' ? 'border-l-4 bg-white text-indigo-600 border-indigo-600 shadow-sm dark:bg-slate-800 dark:text-white dark:border-indigo-500' : 'text-slate-600 hover:bg-white hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white'">
            <svg class="mr-3 h-6 w-6 flex-shrink-0" [ngClass]="activeTab === 'pagamento' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="truncate">Pagamentos</span>
          </a>
        </nav>
      </aside>

      <div class="lg:col-span-9">
        <div class="mb-6 flex items-center justify-between">
          <div>
            <h2 class="text-2xl font-bold leading-7 text-slate-900 dark:text-white sm:truncate sm:text-3xl sm:tracking-tight">
              {{ this.myForm.value.id.length > 20 ? 'Editando Conta a Receber' : 'Cadastrando Conta a Receber'}}
            </h2>
            <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Cadastro de Conta a Receber</p>
          </div>
          <button [routerLink]="'/product/'" class="inline-flex items-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline-indigo-600 dark:bg-indigo-500 dark:hover:bg-indigo-400">
             <svg class="-ml-0.5 mr-1.5 h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M17 10a.75.75 0 01-.75.75H5.612l4.158 3.96a.75.75 0 11-1.04 1.08l-5.5-5.25a.75.75 0 010-1.08l5.5-5.25a.75.75 0 111.04 1.08L5.612 9.25H16.25A.75.75 0 0117 10z" clip-rule="evenodd" /></svg>
             Voltar
          </button>
        </div>

        <div class="rounded-lg shadow ring-1 ring-gray-900/5 transition-colors bg-white dark:bg-slate-800 dark:ring-white/10">

          <form [hidden]="activeTab !== 'dados'" class="px-4 py-6 sm:p-8" [formGroup]="myForm">
            <div class="grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
              <div class="sm:col-span-2">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Forma de Recebimento:</label>
                <div class="mt-2 relative">
                  <select formControlName="form_payment"
                          class="block w-full appearance-none rounded-md border-0 py-1.5 pl-3 pr-10 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 cursor-pointer
                                  bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600
                                  dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500
                                  [&>option]:text-slate-900 dark:[&>option]:bg-slate-800 dark:[&>option]:text-white">
                      <option *ngFor="let role of formPaymentList" [value]="role.type">{{ role.name }}</option>
                  </select>
                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500 dark:text-slate-400">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                      <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
                    </svg>
                  </div>
                </div>
              </div>

              <div class="sm:col-span-2">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Descrição / Nome:</label>
                <div class="mt-2">
                  <input type="text" formControlName="name" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                </div>
              </div>

              <div class="sm:col-span-2" >
                <app-search-loading-unique
                  [search]="searchCategory"
                  (eventEmit)="selectItem($event, 'category_id')">
                </app-search-loading-unique>
              </div>

              <div class="sm:col-span-2" >
                <app-search-loading-unique
                  [search]="searchBank"
                  (eventEmit)="selectItem($event, 'bank_account_id')">
                </app-search-loading-unique>
              </div>

              <div class="sm:col-span-1">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">
                  Data competência:
                </label>
                <div class="relative mt-2">
                   <input type="date" formControlName="date_competence" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                   <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400">
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>
                   </div>
                </div>
              </div>

              <div class="sm:col-span-1">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">
                  Data vencimento:
                </label>
                <div class="relative mt-2">
                  <input type="date" formControlName="date_due" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400">
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>
                  </div>
                </div>
              </div>

              <div class="sm:col-span-2">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Valor:</label>
                <div class="mt-2">
                  <input mask="separator.2" thousandSeparator="." decimalSeparator="," prefix="R$ " currency="BRL" type="text" formControlName="amount" (keyup)="sumValues()" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                </div>
              </div>

            </div>
          </form>

          <form [hidden]="activeTab !== 'cliente'" class="px-4 py-6 sm:p-8" [formGroup]="myForm">
            <div class="grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">

              <div class="sm:col-span-4" >
                <app-search-loading-unique
                  [search]="searchPeople"
                  (eventEmit)="selectItem($event, 'people_id')">
                </app-search-loading-unique>
              </div>

              <div class="sm:col-span-2" >
                <app-search-loading-unique
                  [search]="searchCost"
                  (eventEmit)="selectItem($event, 'cost_center_id')">
                </app-search-loading-unique>
              </div>

              <div class="sm:col-span-6">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Observação:</label>
                <div class="mt-2">
                  <textarea  type="text" formControlName="note" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500"></textarea>
                </div>
              </div>

            </div>
          </form>

          <form [hidden]="activeTab !== 'pagamento'" class="px-4 py-6 sm:p-8" [formGroup]="myForm">
            <div class="grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">

              <div class="sm:col-span-2">
                <label class="block text-xs font-medium text-transparent mb-5 select-none">Repetir?</label>
                <div class="flex gap-6 flex-wrap">
                  <div class="relative flex items-center">
                    <div class="flex h-6 items-center">

                      <input formControlName="repeat"
                             type="checkbox"
                             class="appearance-none h-4 w-4 rounded border border-gray-300 bg-white transition-all cursor-pointer
                                    focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2
                                    checked:bg-indigo-600 checked:border-transparent
                                    checked:bg-[url('data:image/svg+xml;charset=utf-8,%3Csvg%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22white%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M12.207%204.793a1%201%200%20010%201.414l-5%205a1%201%200%2001-1.414%200l-2-2a1%201%200%20011.414-1.414L6.5%209.086l4.293-4.293a1%201%200%20011.414%200z%22%2F%3E%3C%2Fsvg%3E')]
                                    checked:bg-center checked:bg-no-repeat
                                    dark:bg-white/5 dark:border-white/10 dark:focus:ring-offset-slate-900 dark:checked:bg-indigo-500">

                    </div>
                    <div class="ml-2 text-sm leading-6">
                      <label class="font-medium text-slate-700 dark:text-slate-300 cursor-pointer select-none">
                        repetir?
                      </label>
                    </div>
                  </div>

                </div>
              </div>

              <div class="sm:col-span-2" *ngIf="myForm.value.repeat">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Periodo:</label>
                <div class="mt-2 relative">

                  <select formControlName="repeat_period"
                          class="block w-full appearance-none rounded-md border-0 py-1.5 pl-3 pr-10 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 cursor-pointer
                                  bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600
                                  dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500
                                  [&>option]:text-slate-900 dark:[&>option]:bg-slate-800 dark:[&>option]:text-white">
                      <option *ngFor="let role of repeatPeriods" [value]="role.type">{{ role.name }}</option>
                  </select>

                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500 dark:text-slate-400">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                      <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
                    </svg>
                  </div>
                </div>
              </div>

              <div class="sm:col-span-2" *ngIf="myForm.value.repeat">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Ocorrências / Vezes:</label>
                <div class="mt-2">
                  <input type="text" formControlName="repeat_occurrences" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                </div>
              </div>

              <div class="sm:col-span-1">
                <label class="block text-xs font-medium text-transparent mb-5 select-none">Recebido?</label>
                <div class="flex gap-6 flex-wrap">
                  <div class="relative flex items-center">
                    <div class="flex h-6 items-center">

                      <input formControlName="status" (change)="sumValues()"
                             type="checkbox"
                             class="appearance-none h-4 w-4 rounded border border-gray-300 bg-white transition-all cursor-pointer
                                    focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2
                                    checked:bg-indigo-600 checked:border-transparent
                                    checked:bg-[url('data:image/svg+xml;charset=utf-8,%3Csvg%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22white%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M12.207%204.793a1%201%200%20010%201.414l-5%205a1%201%200%2001-1.414%200l-2-2a1%201%200%20011.414-1.414L6.5%209.086l4.293-4.293a1%201%200%20011.414%200z%22%2F%3E%3C%2Fsvg%3E')]
                                    checked:bg-center checked:bg-no-repeat
                                    dark:bg-white/5 dark:border-white/10 dark:focus:ring-offset-slate-900 dark:checked:bg-indigo-500">

                    </div>
                    <div class="ml-2 text-sm leading-6">
                      <label class="font-medium text-slate-700 dark:text-slate-300 cursor-pointer select-none">
                        Recebido?
                      </label>
                    </div>
                  </div>

                </div>
              </div>

              <div class="sm:col-span-1" *ngIf="myForm.value.status">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">
                  Data recebimento:
                </label>
                <div class="relative mt-2">
                  <input type="date" formControlName="date_received" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400">
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>
                  </div>
                </div>
              </div>

              <div class="sm:col-span-1" *ngIf="myForm.value.status">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Descontos / Taxas:</label>
                <div class="mt-2">
                  <input mask="separator.2" thousandSeparator="." decimalSeparator="," prefix="R$ " currency="BRL" type="text" formControlName="discount" (keyup)="sumValues()" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                </div>
              </div>

              <div class="sm:col-span-1" *ngIf="myForm.value.status">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Juros / Multa:</label>
                <div class="mt-2">
                  <input mask="separator.2" thousandSeparator="." decimalSeparator="," prefix="R$ " currency="BRL" type="text" formControlName="fees" (keyup)="sumValues()" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                </div>
              </div>

              <div class="sm:col-span-2" *ngIf="myForm.value.status">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Valor recebido:</label>
                <div class="mt-2">
                  <input mask="separator.2" thousandSeparator="." decimalSeparator="," prefix="R$ " currency="BRL" type="text" formControlName="bill_value" (keyup)="sumValues()" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                </div>
              </div>

            </div>
          </form>

          <div class="flex items-center justify-between gap-x-6 border-t px-4 py-4 sm:px-8 transition-colors border-gray-900/10 bg-gray-50 dark:border-white/10 dark:bg-slate-800/50">
             <div class="flex gap-2">
                <button (click)="prevTab()" type="button" class="rounded-full p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-200 dark:hover:bg-slate-700 dark:hover:text-white transition-all disabled:opacity-50 disabled:cursor-not-allowed" [disabled]="activeTab === 'dados'">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" /></svg>
                </button>
                <button (click)="nextTab()" type="button" class="rounded-full p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-200 dark:hover:bg-slate-700 dark:hover:text-white transition-all disabled:opacity-50 disabled:cursor-not-allowed" [disabled]="activeTab === 'pagamento'">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>
                </button>
             </div>
             <button (click)="save()" class="rounded-md bg-emerald-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600 transition-colors flex items-center gap-2">
