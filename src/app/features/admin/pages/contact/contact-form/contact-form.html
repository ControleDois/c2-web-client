<div class="min-h-screen transition-colors duration-300 bg-gray-50 dark:bg-slate-900">

  <div class="mx-autor">
    <div class="mb-6 flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-bold leading-7 text-slate-900 dark:text-white sm:truncate sm:text-3xl sm:tracking-tight">
          {{ this.myForm.value.id.length > 20 ? 'Editando Contato' : 'Cadastrando Contato'}}
        </h2>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Cadastro de Contato</p>
      </div>
      <button [routerLink]="'../'" class="inline-flex items-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline-indigo-600 dark:bg-indigo-500 dark:hover:bg-indigo-400">
         <svg class="-ml-0.5 mr-1.5 h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M17 10a.75.75 0 01-.75.75H5.612l4.158 3.96a.75.75 0 11-1.04 1.08l-5.5-5.25a.75.75 0 010-1.08l5.5-5.25a.75.75 0 111.04 1.08L5.612 9.25H16.25A.75.75 0 0117 10z" clip-rule="evenodd" /></svg>
         Voltar
      </button>
    </div>

    <div class="rounded-lg shadow ring-1 ring-gray-900/5 transition-colors bg-white dark:bg-slate-800 dark:ring-white/10">

      <form class="px-4 py-6 sm:p-8" [formGroup]="myForm">
        <div class="grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
          <div class="sm:col-span-1">
            <label class="block text-xs font-medium text-transparent mb-5 select-none">Grupo?</label>
            <div class="flex gap-6 flex-wrap">
              <div class="relative flex items-center">
                <div class="flex h-6 items-center">

                  <input formControlName="is_group"
                         type="checkbox"
                         class="appearance-none h-4 w-4 rounded border border-gray-300 bg-white transition-all cursor-pointer
                                focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2
                                checked:bg-indigo-600 checked:border-transparent
                                checked:bg-[url('data:image/svg+xml;charset=utf-8,%3Csvg%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22white%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M12.207%204.793a1%201%200%20010%201.414l-5%205a1%201%200%2001-1.414%200l-2-2a1%201%200%20011.414-1.414L6.5%209.086l4.293-4.293a1%201%200%20011.414%200z%22%2F%3E%3C%2Fsvg%3E')]
                                checked:bg-center checked:bg-no-repeat
                                dark:bg-white/5 dark:border-white/10 dark:focus:ring-offset-slate-900 dark:checked:bg-indigo-500">

                </div>
                <div class="ml-2 text-sm leading-6">
                  <label class="font-medium text-slate-700 dark:text-slate-300 cursor-pointer select-none">
                    Grupo?
                  </label>
                </div>
              </div>

            </div>
          </div>

          <div class="sm:col-span-3">
            <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Nome:</label>
            <div class="mt-2">
              <input type="text" formControlName="name" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
            </div>
          </div>

          <div class="sm:col-span-2">
            <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Email:</label>
            <div class="mt-2">
              <input type="text" formControlName="email" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
            </div>
          </div>

          <div class="sm:col-span-2">
            <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Telefone comercial</label>
            <div class="mt-2">
               <input type="text" formControlName="phone" mask="+00 (00) 0000-0000||+00 (00) 00000-0000"
               [dropSpecialCharacters]="true" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
            </div>
          </div>

          <div class="sm:col-span-1">
            <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">
              Nascimento:
            </label>
            <div class="relative mt-2">
               <input type="date" formControlName="birth" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
               <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>
               </div>
            </div>
         </div>
        </div>
      </form>

      <div class="flex items-center justify-between gap-x-6 border-t px-4 py-4 sm:px-8 transition-colors border-gray-900/10 bg-gray-50 dark:border-white/10 dark:bg-slate-800/50">
         <div class="flex gap-2"></div>
         <button (click)="save()" class="rounded-md bg-emerald-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600 transition-colors flex items-center gap-2">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" /></svg>
            Salvar
         </button>
      </div>
    </div>
  </div>
</div>
