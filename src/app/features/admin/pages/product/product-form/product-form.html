<div class="min-h-screen transition-colors duration-300 bg-gray-50 dark:bg-slate-900">

  <div class="mx-autor">

    <div class="lg:grid lg:grid-cols-12 lg:gap-x-8">

      <aside class="py-6 px-2 lg:col-span-3 lg:px-0 lg:py-0 lg:border-r lg:border-gray-200 dark:lg:border-white/10 lg:pr-8">
        <nav class="space-y-1">

          <a (click)="setTab('dados')"
             class="group flex items-center rounded-md px-3 py-2 text-sm font-medium transition-colors cursor-pointer"
             [ngClass]="activeTab === 'dados' ? 'border-l-4 bg-white text-indigo-600 border-indigo-600 shadow-sm dark:bg-slate-800 dark:text-white dark:border-indigo-500' : 'text-slate-600 hover:bg-white hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white'">
            <svg class="mr-3 h-6 w-6 flex-shrink-0" [ngClass]="activeTab === 'dados' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            <span class="truncate">Dados da Produto</span>
          </a>
        </nav>
      </aside>

      <div class="lg:col-span-9">

        <div class="mb-6 flex items-center justify-between">
          <div>
            <h2 class="text-2xl font-bold leading-7 text-slate-900 dark:text-white sm:truncate sm:text-3xl sm:tracking-tight">
              {{ this.myForm.value.id.length > 20 ? 'Editando Produto' : 'Cadastrando Produto'}}
            </h2>
            <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Cadastro de produto</p>
          </div>
          <button [routerLink]="'/product/'" class="inline-flex items-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline-indigo-600 dark:bg-indigo-500 dark:hover:bg-indigo-400">
             <svg class="-ml-0.5 mr-1.5 h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M17 10a.75.75 0 01-.75.75H5.612l4.158 3.96a.75.75 0 11-1.04 1.08l-5.5-5.25a.75.75 0 010-1.08l5.5-5.25a.75.75 0 111.04 1.08L5.612 9.25H16.25A.75.75 0 0117 10z" clip-rule="evenodd" /></svg>
             Voltar
          </button>
        </div>

        <div class="rounded-lg shadow ring-1 ring-gray-900/5 transition-colors bg-white dark:bg-slate-800 dark:ring-white/10">

          <form *ngIf="activeTab === 'dados'" class="px-4 py-6 sm:p-8" [formGroup]="myForm">
            <div class="grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
              <div class="sm:col-span-2">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Código de Barras:</label>
                <div class="mt-2">
                  <input type="text" formControlName="barcode" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                </div>
              </div>

              <div class="sm:col-span-2">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Nome:</label>
                <div class="mt-2">
                  <input type="text" formControlName="name" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                </div>
              </div>

            <div class="sm:col-span-2">
              <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Unidade:</label>
              <div class="mt-2 relative">

                <select formControlName="unit"
                        class="block w-full appearance-none rounded-md border-0 py-1.5 pl-3 pr-10 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 cursor-pointer
                                bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600
                                dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500
                                [&>option]:text-slate-900 dark:[&>option]:bg-slate-800 dark:[&>option]:text-white">
                    <option *ngFor="let role of listUnit" [value]="role.type">{{ role.name }}</option>
                </select>

                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500 dark:text-slate-400">
                  <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
                  </svg>
                </div>

              </div>
            </div>

            <div class="sm:col-span-2">
              <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Valor:</label>
              <div class="mt-2">
                <input currencyMask type="text" formControlName="sale_value" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
              </div>
            </div>

            <div class="sm:col-span-2">
              <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Tipo de pessoa:</label>
              <div class="mt-2 relative">

                <select formControlName="icms_origin"
                        class="block w-full appearance-none rounded-md border-0 py-1.5 pl-3 pr-10 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 cursor-pointer
                                bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600
                                dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500
                                [&>option]:text-slate-900 dark:[&>option]:bg-slate-800 dark:[&>option]:text-white">
                    <option *ngFor="let role of listIcmsOrigem" [value]="role.type">{{ role.name }}</option>
                </select>

                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500 dark:text-slate-400">
                  <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
                  </svg>
                </div>

              </div>
            </div>

            <div class="sm:col-span-6" >
              <app-search-loading-unique
                [search]="searchNCM"
                (eventEmit)="selectNCM($event)">
              </app-search-loading-unique>
            </div>

              <div class="sm:col-span-2">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Cod. Combustível (ANP):</label>
                <div class="mt-2">
                  <input type="text" formControlName="fuel_anp" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                </div>
              </div>

              <div class="sm:col-span-2">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">Peso Bruto (KG):</label>
                <div class="mt-2">
                  <input type="text" formControlName="gross_weighy" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                </div>
              </div>

              <div class="sm:col-span-2">
                <label class="block text-sm font-medium leading-6 text-slate-900 dark:text-white">CEST:</label>
                <div class="mt-2">
                  <input type="text" formControlName="code_cest" class="block w-full rounded-md border-0 py-1.5 px-3 shadow-sm ring-1 ring-inset focus:outline-none transition-all sm:text-sm sm:leading-6 bg-white text-slate-900 ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:bg-white/5 dark:text-white dark:ring-white/10 dark:focus:ring-indigo-500">
                </div>
              </div>

              <div class="sm:col-span-6" >
                <app-search-loading-unique
                  [search]="searchTaxation"
                  (eventEmit)="selectTaxation($event)">
                </app-search-loading-unique>
              </div>
            </div>
          </form>

          <div class="flex items-center justify-between gap-x-6 border-t px-4 py-4 sm:px-8 transition-colors border-gray-900/10 bg-gray-50 dark:border-white/10 dark:bg-slate-800/50">
             <div class="flex gap-2">
                <button (click)="prevTab()" type="button" class="rounded-full p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-200 dark:hover:bg-slate-700 dark:hover:text-white transition-all disabled:opacity-50 disabled:cursor-not-allowed" [disabled]="activeTab === 'dados'">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" /></svg>
                </button>
                <button (click)="nextTab()" type="button" class="rounded-full p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-200 dark:hover:bg-slate-700 dark:hover:text-white transition-all disabled:opacity-50 disabled:cursor-not-allowed" [disabled]="activeTab === 'endereco'">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>
                </button>
             </div>
             <button (click)="save()" class="rounded-md bg-emerald-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600 transition-colors flex items-center gap-2">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" /></svg>
                Salvar
             </button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
