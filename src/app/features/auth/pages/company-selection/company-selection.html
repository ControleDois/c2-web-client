<div class="min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300 bg-gray-50 dark:bg-slate-900">

  <div class="mb-8 text-center">
    <h1 class="text-2xl font-bold transition-colors text-slate-900 dark:text-white">
      Selecione a Empresa
    </h1>
    <p class="mt-2 transition-colors text-slate-500 dark:text-slate-400">
      Escolha a filial ou organização para acessar.
    </p>
  </div>

  <div class="w-full max-w-md mb-8 relative">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">

      <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-indigo-600 dark:text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>

      <svg *ngIf="!isLoading" class="h-5 w-5 text-gray-400 dark:text-slate-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
      </svg>
    </div>

    <input
      type="text" [formControl]="search"
      placeholder="Buscar na API..."
      class="block w-full pl-10 pr-3 py-3 border rounded-xl leading-5 shadow-sm transition-all focus:outline-none focus:ring-2 sm:text-sm
             bg-white border-gray-300 text-slate-900 placeholder-gray-400 focus:ring-indigo-500 focus:border-indigo-500
             dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100 dark:placeholder-slate-500 dark:focus:bg-slate-800"
    >
  </div>

  <div *ngIf="!isLoading && companies.length === 0" class="text-center mb-8 transition-colors text-slate-500 dark:text-slate-400">
    Nenhuma empresa encontrada na base de dados.
  </div>

  <div class="grid w-full max-w-5xl grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">

    <div *ngFor="let company of companies"
         (click)="selectCompany(company)"
         class="group cursor-pointer relative overflow-hidden rounded-xl border p-6 transition-all hover:-translate-y-1 hover:shadow-lg
                bg-white border-gray-200 hover:border-indigo-500 hover:shadow-indigo-500/10
                dark:bg-slate-800 dark:border-slate-700 dark:hover:border-indigo-500 dark:hover:shadow-indigo-500/10">

      <div class="absolute top-0 right-0 -mt-4 -mr-4 h-24 w-24 rounded-full blur-xl transition-all
                  bg-indigo-500/5 group-hover:bg-indigo-500/10
                  dark:bg-indigo-500/10 dark:group-hover:bg-indigo-500/20"></div>

       <div class="relative z-10 flex items-start gap-4">
        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg font-bold transition-colors
                    bg-gray-100 text-slate-600 group-hover:bg-indigo-600 group-hover:text-white
                    dark:bg-slate-700 dark:text-white">
          {{ company.name.charAt(0) | uppercase }}
        </div>

        <div class="flex-1 overflow-hidden">
          <h3 class="truncate text-lg font-semibold transition-colors
                     text-slate-900 group-hover:text-indigo-600
                     dark:text-white dark:group-hover:text-indigo-400">
            {{ company.name }}
          </h3>

          <p *ngIf="company.social_name && company.social_name !== company.name" class="truncate text-xs mt-0.5 transition-colors text-slate-500 dark:text-slate-500">
            {{ company.social_name }}
          </p>

          <p class="mt-2 flex items-center gap-1 text-sm font-mono transition-colors text-slate-500 dark:text-slate-400">
             <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-3 w-3 opacity-70">
              <path fill-rule="evenodd" d="M2 3.5A1.5 1.5 0 013.5 2h9A1.5 1.5 0 0114 3.5v1.75a.75.75 0 01-1.5 0V3.5a.75.75 0 01.75-.75h9a.75.75 0 01.75.75v.75m0 0v11.5a1.5 1.5 0 01-1.5 1.5h-9a1.5 1.5 0 01-1.5-1.5v-11.5a.75.75 0 01.75-.75h.75" clip-rule="evenodd" />
            </svg>
            {{ company.document }}
          </p>

          <div *ngIf="company.certificate_path"
               class="mt-3 inline-flex items-center gap-1 rounded px-2 py-0.5 text-xs font-medium border
                      bg-green-50 text-green-700 border-green-200
                      dark:bg-green-500/10 dark:text-green-400 dark:border-green-500/20">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Certificado Digital
         </div>
        </div>
      </div>

    </div>

  </div>

  <div class="mt-12 text-center">
    <button (click)="authService.logout()" class="text-sm font-medium transition-colors
            text-slate-500 hover:text-slate-700
            dark:text-slate-500 dark:hover:text-slate-300">
      Voltar para Login
    </button>
  </div>
</div>
