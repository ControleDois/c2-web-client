<nav class="flex mb-5" aria-label="Breadcrumb" *ngIf="breadcrumbs.length > 0">
  <ol role="list" class="flex items-center space-x-2 sm:space-x-4">

    <li>
      <div>
        <a routerLink="/dashboard" class="text-slate-400 hover:text-slate-500 dark:text-slate-500 dark:hover:text-slate-300 transition-colors">
          <svg class="h-5 w-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M9.293 2.293a1 1 0 011.414 0l7 7A1 1 0 0117 11h-1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-3a1 1 0 00-1-1H9a1 1 0 00-1 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-6H3a1 1 0 01-.707-1.707l7-7z" clip-rule="evenodd" />
          </svg>
          <span class="sr-only">Home</span>
        </a>
      </div>
    </li>

    <li *ngFor="let crumb of breadcrumbs; let last = last">
      <div class="flex items-center">

        <svg class="h-5 w-5 flex-shrink-0 text-slate-300 dark:text-slate-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
        </svg>

        <a *ngIf="!last"
           [routerLink]="crumb?.url"
           class="ml-2 sm:ml-4 text-sm font-medium text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-colors">
            {{ crumb?.label }}
        </a>

        <span *ngIf="last"
              class="ml-2 sm:ml-4 text-sm font-medium text-indigo-600 dark:text-white pointer-events-none"
              aria-current="page">
            {{ crumb?.label }}
        </span>

      </div>
    </li>

  </ol>
</nav>
