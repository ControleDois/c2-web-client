<header class="flex h-16 items-center gap-x-4 border-b border-slate-800 bg-slate-900 px-6 shadow-sm">

  <div class="flex flex-1 gap-x-4 self-stretch lg:gap-x-6">
    <form class="relative flex flex-1" action="#" method="GET">
      <label for="search-field" class="sr-only">Buscar</label>
      <div class="relative w-full max-w-md my-auto">
        <svg class="pointer-events-none absolute inset-y-0 left-3 h-full w-5 text-slate-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
        </svg>
        <input id="search-field" class="block h-10 w-full rounded-lg border-0 bg-slate-800 py-0 pl-10 pr-3 text-slate-300 placeholder:text-slate-500 focus:ring-2 focus:ring-inset focus:ring-indigo-500 sm:text-sm" placeholder="Buscar..." type="search" name="search">
      </div>
    </form>
  </div>

  <div class="flex items-center gap-x-4 lg:gap-x-6">

    <div class="hidden md:flex flex-col items-end mr-2">
      <span class="text-xs text-slate-500">{{auth?.company?.people?.document}}</span>
      <span class="text-sm font-semibold text-slate-200">{{auth?.company?.people?.name}}</span>
    </div>

    <div class="h-6 w-px bg-slate-700" aria-hidden="true"></div>

    <el-dropdown class="relative ml-3">
      <button slot="trigger" class="group flex items-center gap-x-1 rounded-full p-1.5 text-sm font-semibold leading-6 text-white hover:bg-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">

        <span class="sr-only">Open user menu</span>

        <img class="h-8 w-8 rounded-full bg-slate-800 object-cover" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="" />

        <span class="hidden lg:flex lg:items-center">

          <span class="ml-2 text-sm font-semibold leading-6 text-white" aria-hidden="true">{{auth?.user?.people?.name}}</span>

          <svg class="ml-2 h-5 w-5 text-gray-400 group-hover:text-white transition-colors" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
          </svg>
        </span>

      </button>

      <el-menu anchor="bottom end" popover class="w-48 origin-top-right rounded-md bg-gray-800 py-1 outline -outline-offset-1 outline-white/10 transition transition-discrete [--anchor-gap:--spacing(2)] data-closed:scale-95 data-closed:transform data-closed:opacity-0 data-enter:duration-100 data-enter:ease-out data-leave:duration-75 data-leave:ease-in">
        <a href="#" class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-hidden">Your profile</a>
        <a href="#" class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-hidden">Settings</a>
        <a (click)="logout()" class="block px-4 py-2 text-sm text-gray-300 focus:bg-white/5 focus:outline-hidden cursor-pointer">Sign out</a>
      </el-menu>
    </el-dropdown>
  </div>
</header>
