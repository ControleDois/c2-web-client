<header class="flex h-16 items-center gap-x-4 border-b border-slate-800 bg-slate-900 px-6 shadow-sm">

  <div class="flex flex-1 gap-x-4 self-stretch lg:gap-x-6">
    <form class="relative flex flex-1" action="#" method="GET">
      <label for="search-field" class="sr-only">Buscar</label>
      <div class="relative w-full max-w-md my-auto">
        <svg class="pointer-events-none absolute inset-y-0 left-3 h-full w-5 text-slate-500" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />

  <div class="flex items-center gap-x-4 lg:gap-x-6">

    <div class="h-6 w-px bg-slate-700" aria-hidden="true"></div>

    <div class="relative flex items-center gap-3">
        <img class="h-8 w-8 rounded-full bg-slate-800 object-cover" src="https://ui-avatars.com/api/?name=Tom+Cook&background=6366f1&color=fff" alt="">

        <span class="hidden lg:flex lg:items-center">
          <span class="text-sm font-semibold leading-6 text-white" aria-hidden="true">Tom Cook</span>
          <svg class="ml-2 h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />

    </div>
