<div class="flex h-full w-72 flex-col bg-slate-900 border-r border-slate-800">
  <div class="flex h-16 items-center px-6 gap-3">
    <div class="h-8 w-8 rounded-lg bg-indigo-500 flex items-center justify-center">
      <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
    </div>
    <span class="text-lg font-bold text-white tracking-wide">ControleDois</span>
  </div>

  <nav class="flex-1 overflow-y-auto px-4 py-4">
    <ul role="list" class="space-y-1">
      <ng-container *ngFor="let item of navItems">
        <ng-container *ngTemplateOutlet="menuTemplate; context: { $implicit: item, level: 0 }"></ng-container>
      </ng-container>
    </ul>
  </nav>

  <div class="border-t border-slate-800 p-4">
    <a routerLink="/settings" class="group flex gap-x-3 rounded-md p-2 text-sm font-semibold leading-6 text-slate-400 hover:bg-slate-800 hover:text-white">
      <svg class="h-6 w-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
      Settings
    </a>
  </div>
</div>

<ng-template #menuTemplate let-item let-level="level">
  <li>
    <div *ngIf="item.children && item.children.length > 0">
      <button
        (click)="toggleSubmenu(item)"
        [style.padding-left.rem]="0.75 + (level * 1)"
        class="group flex w-full items-center gap-x-3 rounded-md p-2 text-left text-sm font-semibold leading-6 text-slate-400 hover:bg-slate-800 hover:text-white transition-colors focus:outline-none">

        <svg *ngIf="item.icon" class="h-5 w-5 shrink-0 text-slate-500 group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
        </svg>
        <div *ngIf="!item.icon" class="h-5 w-5 shrink-0"></div>

        <span class="flex-1">{{ item.label }}</span>

        <svg
          class="h-5 w-5 shrink-0 text-slate-500 transition-transform duration-200"
          [class.rotate-90]="item.expanded"
          viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
        </svg>
      </button>

      <ul *ngIf="item.expanded" class="mt-1 space-y-1">
        <ng-container *ngFor="let child of item.children">
          <ng-container *ngTemplateOutlet="menuTemplate; context: { $implicit: child, level: level + 1 }"></ng-container>
        </ng-container>
      </ul>
    </div>

    <a *ngIf="!item.children"
       [routerLink]="item.route"
       routerLinkActive="bg-slate-800 text-white"
       [style.padding-left.rem]="0.75 + (level * 1)"
       class="group flex gap-x-3 rounded-md p-2 text-sm font-semibold leading-6 text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">

      <svg *ngIf="item.icon" class="h-5 w-5 shrink-0 text-slate-500 group-hover:text-white group-router-link-active:text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
      </svg>
      <div *ngIf="!item.icon" class="h-5 w-5 shrink-0"></div>

      <span>{{ item.label }}</span>
    </a>
  </li>
</ng-template>
