<div class="flex items-center rounded-full p-1 border transition-colors duration-300
            bg-white border-gray-200
            dark:bg-slate-950 dark:border-slate-800">

  <button
    (click)="set('system')"
    [ngClass]="isActive('system')
      ? 'bg-gray-100 text-slate-900 shadow-sm dark:bg-slate-800 dark:text-white'
      : 'text-gray-400 hover:text-gray-600 dark:text-slate-500 dark:hover:text-slate-300'"
    class="flex h-8 w-8 items-center justify-center rounded-full transition-all duration-200 focus:outline-none"
    title="Usar tema do sistema">

    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
    </svg>
  </button>

  <button
    (click)="set('light')"
    [ngClass]="isActive('light')
      ? 'bg-gray-100 text-slate-900 shadow-sm dark:bg-slate-800 dark:text-white'
      : 'text-gray-400 hover:text-gray-600 dark:text-slate-500 dark:hover:text-slate-300'"
    class="flex h-8 w-8 items-center justify-center rounded-full transition-all duration-200 focus:outline-none"
    title="Modo Claro">

    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
    </svg>
  </button>

  <button
    (click)="set('dark')"
    [ngClass]="isActive('dark')
      ? 'bg-gray-100 text-slate-900 shadow-sm dark:bg-slate-800 dark:text-white'
      : 'text-gray-400 hover:text-gray-600 dark:text-slate-500 dark:hover:text-slate-300'"
    class="flex h-8 w-8 items-center justify-center rounded-full transition-all duration-200 focus:outline-none"
    title="Modo Escuro">

    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
    </svg>
  </button>

</div>
