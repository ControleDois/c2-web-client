<div class="relative w-full">

  <label *ngIf="!search.noTitle"
         class="block text-sm font-medium leading-6 mb-1 text-slate-900 dark:text-white transition-colors">
    {{ search.title }}
  </label>

  <div class="relative mt-2">

    <input
      #searchInput
      type="text"
      [formControl]="search.searchField"
      (focus)="onFocus()"
      [readonly]="!!search.searchFieldOn"
      placeholder="Digite para buscar..."
      class="block w-full rounded-md border-0 py-1.5 pl-3 pr-10 shadow-sm ring-1 ring-inset focus:ring-2 focus:ring-inset transition-all duration-200 sm:text-sm sm:leading-6
             bg-white text-slate-900 placeholder:text-gray-400
             dark:bg-white/5 dark:text-white dark:placeholder:text-gray-500"
      [ngClass]="{
        'ring-red-300 focus:ring-red-500 dark:ring-red-500/50 dark:focus:ring-red-500': search.validation === false,
        'ring-gray-300 focus:ring-indigo-600 dark:ring-white/10 dark:focus:ring-indigo-500': search.validation !== false,
        'bg-gray-50 text-gray-500 cursor-not-allowed dark:bg-white/10 dark:text-gray-400': !!search.searchFieldOn
      }"
    />

    <div class="absolute inset-y-0 right-0 flex items-center pr-3">

      <svg *ngIf="loading" class="animate-spin h-5 w-5 text-indigo-600 dark:text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>

      <button *ngIf="search.searchFieldOn && !loading"
              type="button"
              (click)="removeItem()"
              class="text-gray-400 hover:text-red-500 transition-colors focus:outline-none dark:text-slate-400 dark:hover:text-red-400">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
          <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
        </svg>
      </button>

      <button *ngIf="!search.searchFieldOn && !loading"
              type="button"
              (click)="load()"
              class="text-gray-400 hover:text-gray-600 focus:outline-none dark:text-slate-400 dark:hover:text-slate-200">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
          <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <ul *ngIf="showDropdown && list.length > 0"
      class="absolute z-50 mt-1 max-h-60 w-full overflow-auto rounded-md py-1 text-base shadow-lg ring-1 focus:outline-none sm:text-sm animate-fade-in-down
             bg-white ring-black ring-opacity-5
             dark:bg-slate-800 dark:ring-white/10">

    <li *ngFor="let item of list"
        (click)="selectItem(item)"
        class="relative cursor-pointer select-none py-2.5 pl-3 pr-9 transition-colors duration-100 border-b border-gray-100 dark:border-white/5 last:border-0
               hover:bg-indigo-50 dark:hover:bg-indigo-500/10">

      <div class="flex flex-col gap-0.5">
         <span class="font-semibold text-sm text-slate-900 dark:text-white truncate">
           {{ getItemTitle(item) }}
         </span>

         <span *ngFor="let subtitle of getItemSubtitles(item)"
               class="text-xs text-slate-500 dark:text-slate-400 truncate">
           {{ subtitle }}
         </span>
      </div>

      <span *ngIf="search.searchFieldOn?.id === item.id"
            class="absolute inset-y-0 right-0 flex items-center pr-4 text-indigo-600 dark:text-indigo-400">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
          <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd" />
        </svg>
      </span>
    </li>
  </ul>

    <ul *ngIf="showDropdown && list.length === 0 && !loading && search.searchField.value"
        class="absolute z-50 mt-1 w-full overflow-hidden rounded-md py-1 text-base shadow-lg ring-1 focus:outline-none sm:text-sm
               bg-white ring-black ring-opacity-5
               dark:bg-slate-800 dark:ring-white/10">
      <li class="relative cursor-default select-none py-2 pl-3 pr-9 italic text-gray-500 dark:text-slate-400">
        Nenhum resultado encontrado.
      </li>
    </ul>

  </div>
</div>
